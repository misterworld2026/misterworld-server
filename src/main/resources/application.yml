spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/misterworld?characterEncoding=UTF-8}
    username: ${DB_USERNAME:misterworld}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        physical_naming_strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
  flyway:
    baseline-on-migrate: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
server:
  error:
    include-message: never
    include-stacktrace: never
app:
  jwt-secret: ${JWT_SECRET:}

  sms:
    provider: ${SMS_PROVIDER:unavailable}
    dispatch-enabled: ${SMS_DISPATCH_ENABLED:false}

  booking:
    # User-confirmed policy, 2026-11-04. All amounts are per person in integer KRW.
    pricing-unit: PER_PERSON_SURCHARGE
    discount-rounding: HALF_UP
    zone: Asia/Seoul
    honeymoon-size: ONE_TEAM
    cancel-after-deadline: true
