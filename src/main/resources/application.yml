spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/misterworld?characterEncoding=UTF-8}
    username: ${DB_USERNAME:misterworld}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        physical_naming_strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
  flyway:
    baseline-on-migrate: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
server:
  error:
    include-message: never
    include-stacktrace: never
app:
  jwt-secret: ${JWT_SECRET:}
voice:
  python:
    base-url: ${VOICE_PYTHON_BASE_URL:http://127.0.0.1:8001}
    connect-timeout-ms: ${VOICE_PYTHON_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${VOICE_PYTHON_READ_TIMEOUT_MS:180000}
