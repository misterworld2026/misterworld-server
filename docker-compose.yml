

services:
  mysql-db:
    image: mysql:8.0
    container_name: misterworld-mysql
    restart: always
    environment:
      MYSQL_DATABASE: misterworld
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network

  backend:
    build: .
    container_name: misterworld-backend
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mysql-db
    environment:
      DB_URL: jdbc:mysql://mysql-db:3306/misterworld?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      VOICE_PYTHON_BASE_URL: ${VOICE_DOCKER_PYTHON_BASE_URL:-http://host.docker.internal:8001}
      VOICE_PYTHON_CONNECT_TIMEOUT_MS: ${VOICE_PYTHON_CONNECT_TIMEOUT_MS:-3000}
      VOICE_PYTHON_READ_TIMEOUT_MS: ${VOICE_PYTHON_READ_TIMEOUT_MS:-180000}
      SMS_PROVIDER: ${SMS_PROVIDER:-unavailable}
      SMS_DISPATCH_ENABLED: ${SMS_DISPATCH_ENABLED:-false}
      SOLAPI_API_KEY: ${SOLAPI_API_KEY:-}
      SOLAPI_API_SECRET: ${SOLAPI_API_SECRET:-}
      SOLAPI_SENDER_NUMBER: ${SOLAPI_SENDER_NUMBER:-}
    ports:
      - "8081:8080"
    networks:
      - app-network

  voice-ai:
    build: ./voice-service
    container_name: misterworld-voice-ai
    restart: always
    profiles:
      - local-ai
    environment:
      VOICE_STT_DEVICE: cpu
      VOICE_STT_COMPUTE_TYPE: int8
      VOICE_QWEN_DEVICE: cpu
    volumes:
      - voice_models:/app/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - app-network

volumes:
  mysql_data:
  voice_models:

networks:
  app-network:
    driver: bridge
